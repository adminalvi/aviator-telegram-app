<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0e131d; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Bar */
        .top-bar { padding: 12px 16px; background: #181f2c; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283143; }
        .user-name { font-weight: bold; font-size: 14px; color: #38bdf8; }
        
        /* Display Box */
        .game-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #1a2332 0%, #0e131d 100%); }
        .multiplier { font-size: 64px; font-weight: 800; color: #ffffff; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .status-text { font-size: 14px; margin-top: 8px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Control Box */
        .controls { padding: 20px; background: #181f2c; border-top: 1px solid #283143; text-align: center; }
        .btn-cashout { width: 100%; padding: 16px; background: #22c55e; color: #ffffff; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .btn-cashout:active { transform: scale(0.98); }
        .btn-cashout.crashed { background: #ef4444; box-shadow: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>✈️ Aviator Live</span>
        <span class="user-name" id="userDisplay">Player</span>
    </div>

    <div class="game-box">
        <div class="multiplier" id="multiplierText">1.00x</div>
        <div class="status-text" id="statusText">WAITING FOR ROUND...</div>
    </div>

    <div class="controls">
        <button class="btn-cashout" id="actionBtn" onclick="handleCashout()">CASHOUT</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // User info display
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userDisplay').innerText = user.first_name || 'Player';
        }

        const socket = io();
        const multiplierEl = document.getElementById('multiplierText');
        const statusEl = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');

        let currentMultiplier = 1.00;
        let isFlying = false;

        socket.on('tick', (data) => {
            isFlying = true;
            currentMultiplier = parseFloat(data.multiplier);
            multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';
            multiplierEl.style.color = '#38bdf8';
            statusEl.innerText = 'PLANE IS FLYING...';
            statusEl.style.color = '#38bdf8';
            actionBtn.style.background = '#22c55e';
            actionBtn.disabled = false;
        });

        socket.on('crashed', (data) => {
            isFlying = false;
            multiplierEl.innerText = 'FLEW AWAY!';
            multiplierEl.style.color = '#ef4444';
            statusEl.innerText = 'CRASHED AT ' + parseFloat(data.crashPoint).toFixed(2) + 'x';
            statusEl.style.color = '#ef4444';
            actionBtn.style.background = '#64748b';
            actionBtn.disabled = true;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        });

        socket.on('game_state', (data) => {
            if (data.status === 'WAITING') {
                isFlying = false;
                multiplierEl.innerText = '1.00x';
                multiplierEl.style.color = '#ffffff';
                statusEl.innerText = 'WAITING FOR NEXT ROUND...';
                statusEl.style.color = '#94a3b8';
                actionBtn.style.background = '#22c55e';
                actionBtn.disabled = false;
            }
        });

        function handleCashout() {
            if (isFlying) {
                socket.emit('player_cashout', { multiplier: currentMultiplier });
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`CASHED OUT AT ${currentMultiplier.toFixed(2)}x`);
            }
        }
    </script>
</body>
</html>
