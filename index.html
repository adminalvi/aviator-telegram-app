<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Real Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b0e14; color: #fff; display: flex; flex-direction: column; height: 100vh; padding: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #161c28; padding: 12px 16px; border-radius: 10px; }
        .balance { color: #28a745; font-weight: bold; font-size: 18px; }
        .game-screen { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px 0; background: #121824; border-radius: 15px; border: 1px solid #1e2738; }
        .multiplier { font-size: 56px; font-weight: 900; color: #fff; }
        .flying { color: #28a745; }
        .crashed { color: #dc3545; }
        .status { font-size: 14px; color: #8899a6; margin-top: 5px; text-transform: uppercase; }
        .controls { background: #161c28; padding: 15px; border-radius: 12px; }
        .bet-presets { display: flex; gap: 8px; margin-bottom: 10px; }
        .preset-btn { flex: 1; padding: 8px; background: #222c3d; border: 1px solid #324158; color: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .bet-input { flex: 1; padding: 12px; background: #0b0e14; border: 1px solid #222c3d; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; }
        .action-btn { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background: #28a745; color: #fff; }
        .btn-cashout { background: #ffc107; color: #000; }
        .btn-disabled { background: #2c3545; color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="username">Player</div>
        <div class="balance">Rs. <span id="balance">1000.00</span></div>
    </div>

    <div class="game-screen">
        <div id="multiplier" class="multiplier">1.00x</div>
        <div id="status" class="status">WAITING FOR NEXT ROUND...</div>
    </div>

    <div class="controls">
        <div class="bet-presets">
            <button class="preset-btn" onclick="setBet(50)">50</button>
            <button class="preset-btn" onclick="setBet(100)">100</button>
            <button class="preset-btn" onclick="setBet(500)">500</button>
            <button class="preset-btn" onclick="setBet(1000)">1000</button>
        </div>
        <div class="input-group">
            <input type="number" id="betAmount" class="bet-input" value="100" min="10">
        </div>
        <button id="mainBtn" class="action-btn btn-bet" onclick="handleAction()">PLACE BET</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const socket = io(window.location.origin);
        let userState = { balance: 1000 };
        let currentStatus = 'WAITING';
        let hasBet = false;

        socket.on('connect', () => {
            socket.emit('init_user', tg?.initDataUnsafe?.user || { id: 'demo_user', first_name: 'Demo Player' });
        });

        socket.on('user_data', (data) => {
            userState = data;
            document.getElementById('balance').innerText = data.balance.toFixed(2);
            document.getElementById('username').innerText = data.name;
        });

        socket.on('game_state', (data) => {
            currentStatus = data.status;
            if (data.status === 'WAITING') {
                hasBet = false;
                document.getElementById('multiplier').className = 'multiplier';
                document.getElementById('multiplier').innerText = '1.00x';
                document.getElementById('status').innerText = 'PLACE YOUR BETS (5s)...';
                updateButton('BET', false);
            }
        });

        socket.on('game_started', () => {
            currentStatus = 'FLYING';
            if (hasBet) {
                updateButton('CASHOUT', false);
            } else {
                updateButton('IN PROGRESS...', true);
            }
        });

        socket.on('tick', (data) => {
            document.getElementById('multiplier').className = 'multiplier flying';
            document.getElementById('multiplier').innerText = data.multiplier.toFixed(2) + 'x';
            document.getElementById('status').innerText = 'PLANE IS FLYING...';
            if (hasBet) {
                const currentAmount = parseFloat(document.getElementById('betAmount').value) || 0;
                const winEst = (currentAmount * data.multiplier).toFixed(2);
                document.getElementById('mainBtn').innerText = `CASHOUT (Rs. ${winEst})`;
            }
        });

        socket.on('crashed', (data) => {
            currentStatus = 'CRASHED';
            hasBet = false;
            document.getElementById('multiplier').className = 'multiplier crashed';
            document.getElementById('multiplier').innerText = data.crashPoint.toFixed(2) + 'x';
            document.getElementById('status').innerText = 'FLEW AWAY!';
            updateButton('WAITING...', true);
        });

        socket.on('cashout_success', (data) => {
            hasBet = false;
            alert(`Cashed out successfully at ${data.multiplier}x! Won Rs. ${data.winAmount}`);
            updateButton('CASHED OUT', true);
        });

        socket.on('error_msg', (msg) => alert(msg));

        function setBet(val) {
            document.getElementById('betAmount').value = val;
        }

        function handleAction() {
            if (currentStatus === 'WAITING' && !hasBet) {
                const amount = parseFloat(document.getElementById('betAmount').value);
                socket.emit('place_bet', { amount });
                hasBet = true;
                updateButton('BET PLACED', true);
            } else if (currentStatus === 'FLYING' && hasBet) {
                socket.emit('cashout');
            }
        }

        function updateButton(text, disabled) {
            const btn = document.getElementById('mainBtn');
            btn.innerText = text;
            btn.disabled = disabled;
            if (disabled) btn.className = 'action-btn btn-disabled';
            else if (text.includes('CASHOUT')) btn.className = 'action-btn btn-cashout';
            else btn.className = 'action-btn btn-bet';
        }
    </script>
</body>
</html>
